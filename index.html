:root{
  --ink:#111318; --muted:rgba(40,44,56,.62); --hair:rgba(255,255,255,.55);
  --glass:rgba(255,255,255,.42); --glass-strong:rgba(255,255,255,.62);
  --glass-edge:rgba(255,255,255,.75); --shadow:0 10px 36px rgba(30,40,80,.16);
  --tint:#0A84FF; --run:#30C45A; --danger:#FF3B30;
  --bg1:#9EC5FF; --bg2:#E7B6FF; --bg3:#9FF0DA; --bg4:#FFD3A6; --bgbase:#EEF2FA;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F4F6FB; --muted:rgba(235,238,248,.6); --hair:rgba(255,255,255,.12);
    --glass:rgba(40,44,60,.42); --glass-strong:rgba(60,64,82,.6);
    --glass-edge:rgba(255,255,255,.16); --shadow:0 10px 36px rgba(0,0,0,.45);
    --bg1:#1D3FA0; --bg2:#5A1F86; --bg3:#0E6A5C; --bg4:#7A2E3A; --bgbase:#070A14;
  }
}
:root[data-theme="dark"]{
  --ink:#F4F6FB; --muted:rgba(235,238,248,.6); --hair:rgba(255,255,255,.12);
  --glass:rgba(40,44,60,.42); --glass-strong:rgba(60,64,82,.6);
  --glass-edge:rgba(255,255,255,.16); --shadow:0 10px 36px rgba(0,0,0,.45);
  --bg1:#1D3FA0; --bg2:#5A1F86; --bg3:#0E6A5C; --bg4:#7A2E3A; --bgbase:#070A14;
}
*,*::before,*::after{box-sizing:inherit}
html{overflow:hidden;overscroll-behavior:none;height:100%;background:var(--bgbase)}
body{
  margin:0;position:fixed;inset:0;color:var(--ink);background:var(--bgbase);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
.backdrop{
  position:fixed;top:0;left:0;right:0;bottom:-120px;z-index:0;pointer-events:none;overflow:hidden;background:var(--bgbase);
  will-change:transform,filter;transform:translateZ(0);filter:saturate(1) brightness(1);
}
.glow{
  position:absolute;inset:0;opacity:0;pointer-events:none;will-change:opacity;transform:translateZ(0);
  background:radial-gradient(75% 60% at 50% 52%, rgba(255,255,255,.3), rgba(255,255,255,.12) 55%, rgba(255,255,255,.04) 85%);
}
.bw,.bp{position:absolute;inset:0;will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bw i{
  position:absolute;width:75vmax;height:75vmax;margin:-37.5vmax 0 0 -37.5vmax;border-radius:50%;
  background:radial-gradient(circle, var(--c) 0%, color-mix(in srgb, var(--c) 45%, transparent) 38%, transparent 68%);
  animation:drift var(--t) ease-in-out infinite alternate;animation-delay:var(--d);
  transition:opacity .8s;will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.bw:nth-child(1) i{--c:var(--bg1);left:15%;top:15%;--t:19s;--d:0s;--x:18vw;--y:12vh}
.bw:nth-child(2) i{--c:var(--bg2);left:90%;top:32%;--t:23s;--d:-6s;--x:-22vw;--y:16vh}
.bw:nth-child(3) i{--c:var(--bg3);left:40%;top:92%;--t:21s;--d:-11s;--x:20vw;--y:-14vh}
.bw:nth-child(4) i{--c:var(--bg4);left:-5%;top:70%;--t:26s;--d:-4s;--x:24vw;--y:-10vh;opacity:.8}
@keyframes drift{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(calc(var(--x) * .6),calc(var(--y) * -.5)) scale(1.12)}
  100%{transform:translate(var(--x),var(--y)) scale(.94)}
}
/* Press reaction */


.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--glass-edge);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.45);
}
.app{position:relative;z-index:1;height:100%;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
/* iOS 26 paints the status bar strip in the theme-color, so the same color fades into the animated background below it and no edge shows */
.app::before{content:"";position:fixed;top:0;left:0;right:0;height:170px;z-index:-1;pointer-events:none;background:linear-gradient(to bottom,var(--bgbase) 0%,color-mix(in srgb, var(--bgbase) 94%, transparent) 8%,color-mix(in srgb, var(--bgbase) 82%, transparent) 18%,color-mix(in srgb, var(--bgbase) 66%, transparent) 30%,color-mix(in srgb, var(--bgbase) 48%, transparent) 42%,color-mix(in srgb, var(--bgbase) 32%, transparent) 54%,color-mix(in srgb, var(--bgbase) 19%, transparent) 66%,color-mix(in srgb, var(--bgbase) 9%, transparent) 78%,color-mix(in srgb, var(--bgbase) 3%, transparent) 90%,color-mix(in srgb, var(--bgbase) 0%, transparent) 100%)}
.page{height:100%;overflow-y:auto;padding:12px 16px calc(110px + env(safe-area-inset-bottom,0px));display:none;-webkit-overflow-scrolling:touch}
.page.active{display:flex;flex-direction:column}

/* Timer */
#timer{align-items:center;justify-content:center;text-align:center;gap:26px}
/* Activity name, hint and clock sit 90px higher; the NEXT button keeps its place */
#timer .status,#timer .clock{position:relative;top:-90px}
.status{min-height:84px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:0 12px}
.activity{font-size:1.45rem;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.hint{color:var(--muted);font-size:1rem}
#activity{align-self:center;cursor:pointer}
.clock{font-family:-apple-system,"SF Pro Rounded",BlinkMacSystemFont,sans-serif;font-size:clamp(3.4rem,17vw,4.8rem);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.lens{position:relative;display:grid;place-items:center}
.orbs{
  position:absolute;width:112%;aspect-ratio:1;border-radius:50%;
  filter:blur(26px) saturate(140%);opacity:.9;pointer-events:none;
  transform:rotate(var(--spin,0deg)) scale(var(--sc,1));
  transition:transform 1.3s cubic-bezier(.2,1.05,.3,1), opacity .3s, filter .4s;
}
.orbs i{
  position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;margin:-23% 0 0 -23%;border-radius:50%;
  background:radial-gradient(circle, var(--c) 0%, color-mix(in srgb, var(--c) 60%, transparent) 45%, transparent 70%);
  animation:orbit var(--t) linear infinite;animation-delay:var(--d);animation-direction:var(--dir,normal);
}
.orbs i:nth-child(1){--c:#0A84FF;--t:9s;--d:0s;--r:30%}
.orbs i:nth-child(2){--c:#FF375F;--t:11s;--d:-3s;--r:26%;--dir:reverse}
.orbs i:nth-child(3){--c:#FF9F0A;--t:13s;--d:-7s;--r:32%}
.orbs i:nth-child(4){--c:#30D158;--t:10s;--d:-5s;--r:22%;--dir:reverse}
.orbs i:nth-child(5){--c:#BF5AF2;--t:15s;--d:-9s;--r:28%}
@keyframes orbit{
  from{transform:rotate(0deg) translateX(var(--r)) rotate(0deg) scale(1)}
  50%{transform:rotate(180deg) translateX(var(--r)) rotate(-180deg) scale(1.15)}
  to{transform:rotate(360deg) translateX(var(--r)) rotate(-360deg) scale(1)}
}
.lens.running .orbs i{animation-duration:calc(var(--t) * .6)}
.lens.pressed .orbs{--sc:1.18;opacity:1;filter:blur(20px) saturate(190%)}
.lens.burst .orbs{--sc:1.32;filter:blur(16px) saturate(230%) brightness(1.15)}
.big{
  position:relative;width:min(62vw,250px);aspect-ratio:1;border-radius:50%;cursor:pointer;
  font-family:"Syncopate","Futura","Avenir Next",-apple-system,sans-serif;font-size:1.62rem;font-weight:700;letter-spacing:.16em;padding-left:.16em;color:var(--ink);text-shadow:0 1px 8px rgba(255,255,255,.35);
  border:1.5px solid rgba(255,255,255,.7);
  background:
    radial-gradient(55% 38% at 32% 18%, rgba(255,255,255,.4), rgba(255,255,255,0) 70%),
    radial-gradient(70% 70% at 72% 88%, rgba(255,255,255,.12), rgba(255,255,255,0) 60%),
    transparent;
  -webkit-backdrop-filter:blur(6px) saturate(160%);backdrop-filter:blur(6px) saturate(160%);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.7), inset 0 -8px 24px rgba(255,255,255,.12), 0 18px 44px rgba(20,30,70,.18);
  transition:transform .18s cubic-bezier(.3,1.4,.5,1);
}
.big:active{transform:scale(.94)}
.big:focus-visible{outline:3px solid var(--ink);outline-offset:6px}

/* Stats */
h1{font-size:2.1rem;font-weight:700;letter-spacing:-.02em;margin:8px 4px 14px}
h2{font-size:1.1rem;font-weight:600;margin:26px 6px 8px}
.seg{position:relative;display:flex;border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;border:none;background:none;color:var(--ink);font:inherit;font-size:.95rem;font-weight:500;padding:9px 0;border-radius:999px;cursor:pointer;transition:background .2s}
.seg button{position:relative;z-index:1;transition:font-weight .2s}
.seg button.on{font-weight:600}
.seg button.long{letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#range button{font-size:.86rem}
.period{display:block;margin:10px auto 0;border:none;background:none;color:var(--tint);font:inherit;font-weight:600;font-size:.95rem;cursor:pointer;padding:6px 10px}
.dialog input[type=date]{max-width:62%}
.card{border-radius:28px;padding:18px;margin-top:14px}
.donut{display:flex;justify-content:center;padding:6px 0 4px}
.donut svg{width:min(70vw,250px);height:auto;display:block}
.donut circle{transition:stroke-dasharray .5s ease, stroke-dashoffset .5s ease}
/* Pie ring is a transparent tube. Each slice holds a few glowing lights in its own color that drift back and forth inside its arc */
.donut{position:relative}
.donut .pielights{position:absolute;left:50%;top:6px;width:min(70vw,250px);margin-left:calc(min(70vw,250px) / -2);aspect-ratio:1;pointer-events:none;
  -webkit-mask:radial-gradient(circle closest-side, transparent 62.5%, #000 63.5%, #000 88.5%, transparent 89.5%);
  mask:radial-gradient(circle closest-side, transparent 62.5%, #000 63.5%, #000 88.5%, transparent 89.5%)}
.pl-slice{position:absolute;inset:0;--c1:var(--c);--c2:color-mix(in srgb, var(--c) 66%, #fff);--c3:color-mix(in srgb, var(--c) 84%, #000);
  filter:blur(7px) saturate(170%);opacity:.95;
  -webkit-mask:conic-gradient(from var(--a), #000 var(--s), transparent 0);mask:conic-gradient(from var(--a), #000 var(--s), transparent 0)}
.pl-slice.full{-webkit-mask:none;mask:none}
.pl-slice b{position:absolute;inset:0;will-change:transform;animation-name:plswing;animation-duration:var(--t,7s);animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:var(--dir,normal);animation-delay:var(--dl,0s)}
.pl-slice b::before{content:"";position:absolute;left:50%;top:12%;width:var(--w,26%);aspect-ratio:1;margin-left:calc(var(--w,26%) / -2);margin-top:calc(var(--w,26%) / -2);border-radius:50%;
  background:radial-gradient(circle closest-side, var(--bc) 0%, color-mix(in srgb, var(--bc) 65%, transparent) 52%, transparent 100%)}
.pl-slice.multi b::before{animation:plhue var(--hd,16s) linear infinite;animation-delay:var(--hdl,0s)}
@keyframes plhue{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
.pl-slice b:nth-child(1){--bc:var(--c1);--w:23%;--t:6s;--dl:0s}
.pl-slice b:nth-child(2){--bc:var(--c2);--w:19.2%;--t:7.5s;--dl:-2s;--dir:reverse}

@keyframes plswing{
  0%{transform:rotate(calc(var(--mid) - var(--amp) * .8)) scale(1)}
  33%{transform:rotate(calc(var(--mid) + var(--amp) * .9)) scale(1.07)}
  66%{transform:rotate(calc(var(--mid) - var(--amp) * .2)) scale(.94)}
  100%{transform:rotate(calc(var(--mid) - var(--amp) * .8)) scale(1)}
}

/* Sliding selection pill shared by the tab bar and the period switcher */
/* Selection pill modeled on the iOS 26 Apple Music tab bar.
   At rest (--lift 0) it is a dark recessed capsule. While moving (--lift 1) it turns into a clear,
   taller lens with a bright rim and red and blue color fringes on its edges, like refracting glass. */
:root{--pill-rest:.09}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pill-rest:.42}}
:root[data-theme="dark"]{--pill-rest:.42}
.slider{
  --lift:0;
  position:absolute;left:0;top:0;z-index:0;border-radius:999px;pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,calc(.16 * var(--lift))), rgba(255,255,255,0) 60%),
    rgba(0,0,0,calc(var(--pill-rest) * (1 - var(--lift))));
  border:1px solid rgba(255,255,255,calc(.04 + .24 * var(--lift)));
  box-shadow:
    inset 5px 0 9px -3px rgba(255,60,90,calc(.25 * var(--lift))),
    inset -5px 0 9px -3px rgba(70,140,255,calc(.25 * var(--lift))),
    inset 0 4px 7px -3px rgba(255,255,255,calc(.4 * var(--lift))),
    inset 0 -4px 9px -3px rgba(110,255,210,calc(.14 * var(--lift))),
    0 calc(6px * var(--lift)) calc(18px * var(--lift)) rgba(0,0,0,calc(.1 * var(--lift)));
  will-change:transform,width,height;
}
.slider::before{
  content:"";position:absolute;left:16%;right:40%;top:7%;height:22%;border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0));
  opacity:calc(.3 * var(--lift));
}
.slider::after{
  content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;
  background:conic-gradient(from 200deg, rgba(255,80,110,.9), rgba(255,210,90,.7), rgba(120,255,190,.7), rgba(80,150,255,.9), rgba(200,110,255,.8), rgba(255,80,110,.9));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:calc(.2 * var(--lift));
}

/* Sheets */

/* Closing plays the opening animation backwards, so panels leave exactly the way they arrived */
/* Exact rewind of the pop-up: the same keyframes, curves and durations played backwards.
   Opening fades the backdrop during the first 0.2s of the 0.32s rise, so the rewind fades it
   during the last 0.2s. Copies of the keyframes are used so the browser restarts them. */
.scrim.closing{animation:fade-rw .105s ease .063s reverse both;pointer-events:none}
.scrim.closing .sheet{animation:rise-rw .167s cubic-bezier(.2,1.1,.4,1) reverse both}
@keyframes rise-rw{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade-rw{from{opacity:0}to{opacity:1}}

/* Start button: clear glass with the same drifting lights as the NEXT button */
.lightpill{
  position:relative;overflow:hidden;isolation:isolate;color:var(--ink);font-weight:700;letter-spacing:.01em;
  background:radial-gradient(60% 120% at 30% 0%, rgba(255,255,255,.35), rgba(255,255,255,0) 70%), rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.7), inset 0 -6px 16px rgba(255,255,255,.1), 0 8px 24px rgba(20,30,70,.18);
}
.lightpill[hidden]{display:none}
.lp-label{position:relative;z-index:2;text-shadow:0 1px 8px rgba(255,255,255,.3)}
.lp-orbs{position:absolute;inset:-60% -10%;z-index:0;filter:blur(16px) saturate(140%);opacity:.85;pointer-events:none}
.lp-orbs i{
  position:absolute;top:10%;width:34%;height:80%;border-radius:50%;
  background:radial-gradient(circle, var(--c) 0%, color-mix(in srgb, var(--c) 55%, transparent) 45%, transparent 72%);
  animation:lpdrift var(--t) ease-in-out infinite;animation-delay:var(--d);animation-direction:var(--dir,normal);
}
.lp-orbs i:nth-child(1){--c:#0A84FF;left:0%;--t:6s;--d:0s}
.lp-orbs i:nth-child(2){--c:#FF375F;left:30%;--t:7.5s;--d:-2s;--dir:reverse}
.lp-orbs i:nth-child(3){--c:#FF9F0A;left:55%;--t:8.5s;--d:-4s}
.lp-orbs i:nth-child(4){--c:#30D158;left:15%;--t:7s;--d:-3s;--dir:reverse}
.lp-orbs i:nth-child(5){--c:#BF5AF2;left:66%;--t:9.5s;--d:-6s}
@keyframes lpdrift{
  0%{transform:translate(-45%,-12%) scale(1)}
  33%{transform:translate(55%,14%) scale(1.15)}
  66%{transform:translate(10%,-8%) scale(.9)}
  100%{transform:translate(-45%,-12%) scale(1)}
}
/* Red variant for Stop only and Delete: the same drifting lights in shades of red */
.lightpill.red .lp-orbs i:nth-child(1){--c:#FF3B30}
.lightpill.red .lp-orbs i:nth-child(2){--c:#FF2D55}
.lightpill.red .lp-orbs i:nth-child(3){--c:#FF6961}
.lightpill.red .lp-orbs i:nth-child(4){--c:#D70015}
.lightpill.red .lp-orbs i:nth-child(5){--c:#FF453A}
/* Grey variant for Cancel: the same drifting lights in silver and graphite tones */
.lightpill.grey .lp-orbs i:nth-child(1){--c:#8E8E93}
.lightpill.grey .lp-orbs i:nth-child(2){--c:#C7C7CC}
.lightpill.grey .lp-orbs i:nth-child(3){--c:#636366}
.lightpill.grey .lp-orbs i:nth-child(4){--c:#AEAEB2}
.lightpill.grey .lp-orbs i:nth-child(5){--c:#48484A}
.lightpill.grey .lp-orbs{opacity:.75}
/* Each variant moves on its own rhythm so side-by-side buttons never drift in step */
.lightpill.red .lp-orbs i:nth-child(1){--t:5.2s}
.lightpill.red .lp-orbs i:nth-child(2){--t:6.8s;--dir:normal}
.lightpill.red .lp-orbs i:nth-child(3){--t:4.6s;--dir:reverse}
.lightpill.red .lp-orbs i:nth-child(4){--t:7.9s;--dir:normal}
.lightpill.red .lp-orbs i:nth-child(5){--t:6.1s;--dir:reverse}
.lightpill.grey .lp-orbs i{animation-name:lpsweep;animation-timing-function:cubic-bezier(.45,0,.55,1)}
.lightpill.grey .lp-orbs i:nth-child(1){--t:11s;--dir:reverse}
.lightpill.grey .lp-orbs i:nth-child(2){--t:9.3s;--dir:alternate}
.lightpill.grey .lp-orbs i:nth-child(3){--t:13.5s;--dir:normal}
.lightpill.grey .lp-orbs i:nth-child(4){--t:10.2s;--dir:alternate-reverse}
.lightpill.grey .lp-orbs i:nth-child(5){--t:12.4s;--dir:reverse}
@keyframes lpsweep{
  0%{transform:translate(-70%,6%) scale(.95)}
  50%{transform:translate(70%,-6%) scale(1.1)}
  100%{transform:translate(-70%,6%) scale(.95)}
}
/* Blue variant for Resume, on its own rhythm */
.lightpill.blue .lp-orbs i:nth-child(1){--c:#0A84FF;--t:6.4s;--dir:reverse}
.lightpill.blue .lp-orbs i:nth-child(2){--c:#5AC8FA;--t:8.2s;--dir:normal}
.lightpill.blue .lp-orbs i:nth-child(3){--c:#007AFF;--t:5.7s;--dir:normal}
.lightpill.blue .lp-orbs i:nth-child(4){--c:#64D2FF;--t:9.1s;--dir:reverse}

/* Orange variant for Adjust activity */

.lightpill.orange .lp-orbs i:nth-child(2){--c:#FFB340;--t:5.8s;--dir:reverse}
.lightpill.orange .lp-orbs i:nth-child(3){--c:#FF8A00;--t:8.8s;--dir:reverse}
.lightpill.orange .lp-orbs i:nth-child(4){--c:#FFCC66;--t:7.4s;--dir:normal}

/* Green variant for Save, on its own rhythm */

.lightpill.green .lp-orbs i:nth-child(2){--c:#66E08A;--t:8.2s;--dir:normal}
.lightpill.green .lp-orbs i:nth-child(3){--c:#28CD41;--t:5.7s;--dir:normal}

<script>
const LS_KEY = "timelog-v1";
let state = { current: null, sessions: [], colors: {}, updatedAt: 0 };
let range = "today";
let shift = 0;   /* days the chosen period has been moved back by swiping the bar chart (0 or negative) */
let swipedAt = 0;
const $ = id => document.getElementById(id);

/* ---------- storage ---------- */
function loadLocal(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return null;
}
function persist(){
  state.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ toast("Could not save. Export a CSV backup."); }
}
async function initStorage(){
  let persisted = false;
  try {
    if (navigator.storage && navigator.storage.persist)
      persisted = await navigator.storage.persisted() || await navigator.storage.persist();
  } catch(e){}
  $("syncNote").textContent = "All data is saved on this phone. Removing the Home Screen button deletes data. Back it up with \u201CExport CSV\u201D.";
}

/* ---------- helpers ---------- */
function clockFmt(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  return h + ":" + String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
}
function durFmt(ms){
  const m = Math.round(ms/60000);
  if (m < 1) return "<1m";
  const h = Math.floor(m/60), mm = m%60;
  return h ? (mm ? h+"h "+mm+"m" : h+"h") : mm+"m";
}
function hhmm(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function dayLabel(ts){
  const d = new Date(ts); d.setHours(0,0,0,0);
  const t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((t - d) / 864e5);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday:"long", month:"short", day:"numeric" });
}
let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- colors (vivid, fully saturated) ---------- */
const PALETTE = ["#0A84FF","#FF8A00","#1FBF4A","#FF3FD0","#FFD60A","#00D2F0","#FF3B30","#B44FF0","#A6E22E","#5A48F0","#00C9A7","#FF7FA8"];   /* well separated hues, in an order where neighbouring slices contrast */
/* Palette order follows the color wheel, row by row: every color is clearly different from its neighbours */
const SWATCHES = ["#FF3B30","#FF8A00","#FFD60A","#A6E22E","#1FBF4A","#00C9A7","#00D2F0","#0A84FF","#5A48F0","#B44FF0","#FF3FD0","#FF7FA8","#A2845E","#A0A0A8"];
function colorMap(noCustom){
  const map = {}; let n = 0;
  const custom = noCustom ? {} : (state.colors || {});
  const add = l => { const k = l.toLowerCase(); if (!(k in map)){ const auto = PALETTE[n++ % PALETTE.length]; map[k] = custom[k] || auto; } };
  state.sessions.forEach(s => add(s.label));
  if (state.current) add(state.current.label);
  return map;
}

/* ---------- timer ---------- */
function tick(){ if (state.current) $("clock").textContent = clockFmt(Date.now() - state.current.start); }
function renderTimer(){
  const b = $("big");
  if (state.current){
    b.textContent = "NEXT"; $("lens").classList.add("running"); document.body.classList.add("running");
    $("activity").textContent = state.current.label;
    $("hint").textContent = "Since " + hhmm(state.current.start);
    tick();
  } else {
    b.textContent = "NEXT"; $("lens").classList.remove("running"); document.body.classList.remove("running");
    $("activity").textContent = "";
    $("hint").textContent = "";
    $("clock").textContent = "0:00:00";
  }
}

/* ---------- start / switch sheet ---------- */
let mode = "start", pressTime = 0, timeTouched = false;

/* Exact press moment unless the time was changed. A picked time later than now counts as yesterday. */
function pickedTime(){
  if (!timeTouched || !$("when").value) return pressTime;
  const [h, m] = $("when").value.split(":").map(Number);
  const d = new Date(pressTime); d.setHours(h, m, 0, 0);
  let t = d.getTime();
  if (t > Date.now() + 60000) t -= 864e5;
  return t;
}
function usedLabels(exclude){
  /* Most used first (number of sessions), ties go to the more recent one. */
  const info = {};
  state.sessions.forEach((s, i) => {
    const k = s.label.toLowerCase();
    if (!info[k]) info[k] = { label: s.label, count: 0, last: 0 };
    info[k].count++; info[k].last = i; info[k].label = s.label;
  });
  const ex = exclude ? exclude.toLowerCase() : null;
  return Object.keys(info).filter(k => k !== ex).sort((a, b) => info[b].count - info[a].count || info[b].last - info[a].last).slice(0, 16).map(k => info[k].label);
}
function openSheet(){
  timeTouched = false;
  $("err").textContent = "";
  $("when").value = hhmm(pressTime);
  $("what").value = "";
  const sw = mode === "switch";
  $("sheetTitle").textContent = sw ? "What's next?" : "What are you doing?";
  $("sheetSub").hidden = !sw;
  if (sw) $("sheetSub").textContent = "Finishing " + state.current.label + ", started at " + hhmm(state.current.start);
  $("whenLabel").textContent = sw ? "Switch time" : "Start time";
  $("goLabel").textContent = sw ? "Start next" : "Start";
  $("stopOnly").hidden = !sw;
  const chips = $("chips"); chips.innerHTML = "";
  usedLabels(sw ? state.current.label : null).forEach(l => {
    const c = document.createElement("button");
    c.textContent = l;
    c.onclick = () => submitNext(l);
    chips.appendChild(c);
  });
  showScrim("sheetScrim");
  /* The chips stretch to fill the row, and only as many as fit in two rows are kept. */
  requestAnimationFrame(() => {
    const btns = Array.from(chips.children); if (!btns.length) return;
    const tops = Array.from(new Set(btns.map(b => b.offsetTop))).sort((a, b) => a - b);
    const limit = tops.length > 1 ? tops[1] : tops[0];
    btns.forEach(b => { if (b.offsetTop > limit) b.remove(); });
  });
  setTimeout(() => $("what").focus(), 60);
}
function closeSheet(){ hideScrim("sheetScrim"); $("what").blur(); }
function finishCurrent(end){
  if (end <= state.current.start){
    $("err").textContent = "The time must be after " + hhmm(state.current.start) + ", when this session started.";
    return false;
  }
  state.sessions.push({ id: end.toString(36) + Math.random().toString(36).slice(2,6), label: state.current.label, start: state.current.start, end });
  return true;
}
function submitNext(label){
  label = (label || "").trim();
  if (!label){ $("err").textContent = "Type what you are doing, or pick a recent one."; $("what").focus(); return; }
  const t = pickedTime();
  if (mode === "switch" && state.current){
    if (!finishCurrent(t)) return;
    toast("Saved " + state.current.label + ", " + durFmt(t - state.current.start));
  }
  state.current = { label, start: t };
  sensation();
  closeSheet(); persist(); render();
}
function stopOnly(){
  if (!state.current) return;
  const t = pickedTime();
  if (!finishCurrent(t)) return;
  toast("Saved " + state.current.label + ", " + durFmt(t - state.current.start));
  state.current = null;
  sensation();
  closeSheet(); persist(); render();
}
/* Sends each background color field to a new random spot, like a page change. */
/* Background motion runs frame by frame (no CSS transitions, so no end-of-animation flash on iPhone).
   Each color field follows its own looping path across the screen at its own speed, so they never
   stop and never move together. The field itself trails that path on a spring, which gives it a
   lively, slightly bouncy feel. A press gives each field a different reaction and moves it to a
   new part of its path, and afterwards every field keeps wandering at the normal pace. */
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const fields = [...document.querySelectorAll(".bp")].map((el, i) => ({
  el, x:0, y:0, vx:0, vy:0,
  /* Path: two blended loops per axis with different speeds. */
  ax: rnd(24, 34), ay: rnd(18, 26), bx: rnd(8, 14), by: rnd(6, 12),
  fx: rnd(0.07, 0.12) * (i % 2 ? -1 : 1), fy: rnd(0.06, 0.11), gx: rnd(0.17, 0.26), gy: rnd(0.15, 0.24) * (i % 2 ? 1 : -1),
  px: rnd(0, TAU), py: rnd(0, TAU), qx: rnd(0, TAU), qy: rnd(0, TAU),
  clock: rnd(0, 40), s:1, sv:0, sPhase: rnd(0, TAU), sBoost: 0
}));
let pace = 1, glowLevel = 0, glowTarget = 0, lastFrame = 0, pressingNow = false, flashUntil = 0;

function pathAt(f){
  const t = f.clock;
  return [
    f.ax * Math.sin(TAU * f.fx * t + f.px) + f.bx * Math.sin(TAU * f.gx * t + f.qx),
    f.ay * Math.sin(TAU * f.fy * t + f.py) + f.by * Math.sin(TAU * f.gy * t + f.qy)
  ];
}
function frame(now){
  const dt = Math.min(0.05, (now - (lastFrame || now)) / 1000); lastFrame = now;
  pace = 1 + (pace - 1) * Math.exp(-dt / 2.5);          /* back to normal pace, never slower */
  fields.forEach(f => {
    f.clock += dt * pace;
    const [tx, ty] = pathAt(f);
    /* Spring toward the moving path point: stiffness 5, light damping. */
    f.vx += ((tx - f.x) * 5 - f.vx * 2.4) * dt;
    f.vy += ((ty - f.y) * 5 - f.vy * 2.4) * dt;
    f.x += f.vx * dt; f.y += f.vy * dt;
    /* Size breathes gently; a press adds a pop that settles back into the breathing. */
    f.sBoost *= Math.exp(-dt / 1.6);
    const ts = 1 + 0.12 * Math.sin(f.clock * 0.9 + f.sPhase) + f.sBoost;
    f.sv += ((ts - f.s) * 18 - f.sv * 6) * dt; f.s += f.sv * dt;
    f.el.style.transform = "translate3d(" + f.x.toFixed(2) + "vw," + f.y.toFixed(2) + "vh,0) scale(" + Math.max(0.4, f.s).toFixed(3) + ")";
  });
  applyPulse(now, dt);
  requestAnimationFrame(frame);
}
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!calm) requestAnimationFrame(frame);
document.addEventListener("visibilitychange", () => { lastFrame = 0; });

/* The press flash from the first version: colors saturate, brighten and swell, then settle.
   It is computed every frame and the filter never switches off (it rests at neutral values),
   so Safari never has to swap the layer, which is what caused the unwanted flicker. */
const backdropEl = document.querySelector(".backdrop");
const REST  = { sat:1,   br:1,    sc:1,    rot:0 };
const HOLD  = { sat:1.5, br:1.04, sc:1.06, rot:0 };   /* while the finger is down */
const PEAK  = { sat:1.9, br:1.1,  sc:1.14, rot:2 };   /* 35% into the flash */
let pressAmt = 0, pulseStart = 0, pulseFrom = REST, cur = { ...REST };
function bezier(x1, y1, x2, y2){
  const cx = 3*x1, bx = 3*(x2-x1) - cx, ax = 1 - cx - bx, cy = 3*y1, by = 3*(y2-y1) - cy, ay = 1 - cy - by;

/* For the merged small-slice group: up to 6 clearly different colors, spread over the whole color wheel and ordered so neighbours contrast.

function parseCSV(text){

      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r"){
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(cur); rows.push(row); row = []; cur = "";
    } else cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }

}

/* The pill's left and right edges are each pulled by a spring. The edge in the direction of travel

}
function stepPill(pill, now){
  const s = pill._s, dt = Math.min(0.032, s.last ? (now - s.last) / 1000 : 0.016); s.last = now;
  const fast = 691, slow = 407;                      /* stiffness of leading and trailing edge */
  const kL = s.lead === "L" ? fast : slow, kR = s.lead === "R" ? fast : slow;
  const cL = 2 * Math.sqrt(kL) * 0.92, cR = 2 * Math.sqrt(kR) * 0.92;   /* just under critical: a soft settle */
  /* Two small sub-steps per frame keep the springs stable and silky. */
  for (let i = 0; i < 2; i++){
    const h = dt / 2;
    s.vL += ((s.T.L - s.L) * kL - s.vL * cL) * h; s.L += s.vL * h;
    s.vR += ((s.T.R - s.R) * kR - s.vR * cR) * h; s.R += s.vR * h;
  }
  const done = Math.abs(s.T.L - s.L) < 0.2 && Math.abs(s.T.R - s.R) < 0.2 && Math.abs(s.vL) < 2 && Math.abs(s.vR) < 2;
  if (done){ s.L = s.T.L; s.R = s.T.R; s.vL = s.vR = 0; }
  const settled = done && (s.lift || 0) < 0.01;
  if (settled) s.run = false;
  drawPill(pill);
  if (!settled) requestAnimationFrame(t => stepPill(pill, t));
}
function drawPill(pill){
  const s = pill._s, w0 = Math.max(8, s.R - s.L), base = s.T.R - s.T.L;
  /* Lift rises fast as soon as the pill travels and falls once it has arrived. */
  const speed = (Math.abs(s.vL) + Math.abs(s.vR)) / 2;
  const away = Math.abs(s.T.L - s.L) + Math.abs(s.T.R - s.R);
  const want = (speed > 60 || away > 3) ? 1 : 0;
  s.lift = (s.lift || 0) + (want - (s.lift || 0)) * (want > (s.lift || 0) ? 0.5 : 0.32);
  if (!s.run && s.lift < 0.01) s.lift = 0;
  const l = s.lift;
  /* Lens shape: taller than the bar and a little wider, keeping its center. */
  const hh = s.T.h * (1 + 0.16 * l), w = w0 * (1 + 0.03 * l);
  const x = s.L - (w - w0) / 2, y = s.T.y - (hh - s.T.h) / 2;
  pill.style.width = w.toFixed(2) + "px";
  pill.style.height = hh.toFixed(2) + "px";
  pill.style.setProperty("--lift", l.toFixed(3));
  pill.style.transform = "translate3d(" + x.toFixed(2) + "px," + y.toFixed(2) + "px,0)";
  /* Magnify whatever sits under the lens, like the enlarged icon in the reference. */
  const cx = x + w / 2, box = pill.parentNode;
  box.querySelectorAll(":scope > button").forEach(b => {
    const bc = b.offsetLeft + b.offsetWidth / 2;
    const d = Math.abs(bc - cx) / (w / 2 + b.offsetWidth / 4);
    const m = Math.max(0, 1 - d) * l;
    b.style.transform = m > 0.005 ? "scale(" + (1 + 0.07 * m).toFixed(4) + ")" : "";
  });
}
window.addEventListener("focusout", () => { setTimeout(() => window.scrollTo(0, 0), 50); setTimeout(() => window.scrollTo(0, 0), 350); });
window.addEventListener("resize", () => { syncSlider(document.querySelector("nav"), false); syncSlider($("range"), false); });

/* Start every light at a random point in its cycle, so no two buttons ever line up. */
document.querySelectorAll(".lp-orbs i").forEach(i => { i.style.animationDelay = (-Math.random() * 14).toFixed(2) + "s"; });

/* ---------- panel open / close ---------- */
const scrimTimers = {};
function showScrim(id){
  const el = $(id); clearTimeout(scrimTimers[id]);
  el.classList.remove("closing"); el.classList.add("open");
}
function hideScrim(id){
  const el = $(id);
  if (!el.classList.contains("open") || el.classList.contains("closing")) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ el.classList.remove("open"); return; }
  el.classList.add("closing");
  scrimTimers[id] = setTimeout(() => el.classList.remove("open", "closing"), 180);
}

function render(){ renderTimer(); renderStats(); }

/* ---------- start ---------- */
const local = loadLocal();
if (local){
  state = { current: local.current || null, sessions: local.sessions || [], colors: local.colors || {}, updatedAt: local.updatedAt || 0 };
  /* Give every old session a unique id so delete always targets the right one. */
  const seen = new Set();
  state.sessions.forEach(s => {
    if (!s.id || seen.has(s.id)) s.id = s.start.toString(36) + Math.random().toString(36).slice(2,8);
    seen.add(s.id);
  });
}
render();
syncSlider(document.querySelector("nav"), false);
setInterval(tick, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
initStorage();
</script>
